<!doctype html>
<html lang="pt-BR">
<head>

  .url { position: absolute; left: 96px; bottom: 56px; font-size: 26px; color: #94a3b8; }
  svg { position: absolute; right: 96px; bottom: 56px; }
</style>
</head>
<body>
  <div class="cargo">Data Engineer</div>

  <div class="url">dev-pprado.github.io</div>
  <svg width="120" height="120" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="7" fill="#0369a1"/>

    <rect x="13.75" y="12" width="4.5" height="13" rx="1.5" fill="#fff"/>

</html>
