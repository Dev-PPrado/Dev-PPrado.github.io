var code="from datetime import datetime\n\nimport pandas as pd\nfrom airflow.decorators import dag, task\n\n\n@dag(schedule=\"@hourly\", start_date=datetime(2026, 9, 1), catchup=False)\ndef weather_etl():\n    @task\n    def transform(raw: dict) -> str:\n        \"\"\"Normaliza o JSON da API e grava em Parquet.\"\"\"\n        df = pd.json_normalize(raw[\"list\"])\n        df[\"temp_c\"] = df[\"main.temp\"] - 273.15\n        path = f\"data/silver/weather_{raw['dt']}.parquet\"\n        df.to_parquet(path, index=False)\n        return path\n\n    transform(extract())\n\n\nweather_etl()\n";
ReactDOM.createRoot(document.getElementById('root')).render(h(P.CodeBlock,{filename:'dags/weather_etl.py',code:code,highlight:[13,14],caption:'Airflow TaskFlow API — trecho ilustrativo do pipeline de dados climáticos'}));
</script>
